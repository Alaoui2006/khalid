<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070707; --card:#101010; --line:#2a2823; --text:#f5f1e8; --muted:#a29d90;
  --gold:#bfa77a; --gold-hi:#efe6d0; --gold-lo:#7d6c4a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,sans-serif;
  background:radial-gradient(ellipse at 50% -10%,#1e1c18 0,#070707 60%) var(--bg)}
.wrap{max-width:440px;margin:0 auto;padding:36px 22px 44px;text-align:center}

/* Photo */
.photo{width:136px;height:136px;margin:0 auto;border-radius:50%;padding:3px;
  background:conic-gradient(from 30deg,var(--gold-lo),var(--gold-hi),var(--gold-lo),var(--gold-hi),var(--gold-lo));
  box-shadow:0 0 40px rgba(191,167,122,.14);position:relative}
.photo>div{width:100%;height:100%;border-radius:50%;background:#141414;display:grid;place-items:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:none}
.photo span{font-family:"Cormorant Garamond",Georgia,serif;font-size:2.6rem;font-weight:600;color:var(--gold-hi);letter-spacing:.05em}

/* Titres */
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:2.1rem;letter-spacing:.04em;margin:22px 0 6px;
  background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi),var(--gold-lo));background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.title{margin:0;color:var(--text);font-size:.95rem;font-weight:500}
.company{margin:4px 0 0;color:var(--gold);font-size:.74rem;letter-spacing:.28em;text-transform:uppercase}
.title:empty,.company:empty{display:none}
.rule{display:flex;align-items:center;gap:10px;justify-content:center;margin:22px 0}
.rule::before,.rule::after{content:"";height:1px;width:80px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{transform:scaleX(-1)}
.rule i{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}

/* Bouton principal */
.save{position:relative;overflow:hidden;width:100%;border:0;cursor:pointer;font:600 .95rem Inter,system-ui,sans-serif;letter-spacing:.06em;
  color:#1a1610;background:linear-gradient(135deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));
  border-radius:14px;padding:16px 18px;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 8px 26px rgba(191,167,122,.16);transition:transform .15s}
.save:active{transform:scale(.98)}
.save svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.save::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);
  transform:translateX(-120%);animation:sweep 4.5s 1.6s infinite}

/* Liens */
.btn{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:var(--text);
  background:linear-gradient(180deg,#141414,#0d0d0d);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:11px;
  transition:transform .15s,border-color .2s}
.btn:hover,.btn:active{transform:translateY(-2px);border-color:var(--gold)}
.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--gold);
  background:#171613;border:1px solid var(--line);transition:background .2s,color .2s}
.btn:hover .ico{background:var(--gold);color:#14110a}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn small{display:block;color:var(--muted);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.btn span{font-weight:500;font-size:.95rem;word-break:break-all}
footer{margin-top:26px;color:var(--muted);font-size:.72rem;letter-spacing:.08em}

/* Animations */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:200% 0}}
@keyframes sweep{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
.photo{animation:rise .8s backwards}
h1{animation:rise .8s .15s backwards,shine 7s linear infinite}
.title{animation:rise .8s .25s backwards}
.company{animation:rise .8s .33s backwards}
.rule{animation:rise .8s .4s backwards}
.save{animation:rise .7s .5s backwards}
.btn{animation:rise .6s var(--d,.6s) backwards}
.btn:nth-of-type(1){--d:.62s}.btn:nth-of-type(2){--d:.72s}.btn:nth-of-type(3){--d:.82s}
.btn:nth-of-type(4){--d:.92s}.btn:nth-of-type(5){--d:1.02s}.btn:nth-of-type(6){--d:1.12s}.btn:nth-of-type(7){--d:1.22s}
footer{animation:rise .8s 1.4s backwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">

  <div class="photo"><div>
    <img id="photo" alt="Photo de profil">
    <span id="initials"></span>
  </div></div>

  <h1 id="fullname"></h1>
  <p class="title" id="jobtitle"></p>
  <p class="company" id="company"></p>

  <div class="rule"><i></i></div>

  <button class="save" id="saveBtn" type="button">
    <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
    Enregistrer le contact
  </button>

  <div id="links"></div>

  <footer id="footer"></footer>
</main>

/* ---------- Ne touche pas en dessous ---------- */
const ICONS = {
  whatsapp:'<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l1.9-5.4A8.4 8.4 0 1 1 21 11.5z"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
  facebook:'<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>'
};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const fullName = (C.firstName + " " + C.lastName).trim();
const digits = C.phoneIntl.replace(/\D/g,"");
const handle = C.instagram ? "@" + C.instagram.replace(/\/+$/,"").split("/").pop().split("?")[0] : "";

document.title = fullName;
document.getElementById("fullname").textContent = fullName;
document.getElementById("jobtitle").textContent = C.title;
document.getElementById("company").textContent = C.company;
document.getElementById("footer").textContent = "© " + (C.company || fullName);
document.getElementById("initials").textContent = ((C.firstName[0]||"") + (C.lastName[0]||"")).toUpperCase();
if (C.photo) {
  const img = document.getElementById("photo");
  img.onload = () => { img.style.display = "block"; document.getElementById("initials").style.display = "none"; };
  img.src = C.photo;
}

const items = [
  C.phoneIntl && ["whatsapp","WhatsApp",C.phone,"https://wa.me/"+digits,true],
  C.phoneIntl && ["phone","Téléphone",C.phone,"tel:"+C.phoneIntl,false],
  C.instagram && ["instagram","Instagram",handle,C.instagram,true],
  C.facebook  && ["facebook","Facebook",C.facebook.replace(/\/+$/,"").split("/").pop().split("?")[0],C.facebook,true],
  C.email     && ["mail","E-mail",C.email,"mailto:"+C.email,false],
  C.website   && ["globe","Site web",C.website.replace(/^https?:\/\//,""),C.website,true],
  (C.location || C.maps) && ["pin","Localisation",C.location || "Google Maps",C.maps || ("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(C.location)),true]
].filter(Boolean);

document.getElementById("links").innerHTML = items.map(([ic,label,text,href,ext]) =>
  `<a class="btn" href="${esc(href)}"${ext ? ' target="_blank" rel="noopener"' : ""}>
     <div class="ico"><svg viewBox="0 0 24 24">${ICONS[ic]}</svg></div>
     <div><small>${label}</small><span>${esc(text)}</span></div>
   </a>`).join("");

/* Enregistrer le contact (.vcf) */
document.getElementById("saveBtn").addEventListener("click", () => {
  const v = ["BEGIN:VCARD","VERSION:3.0",
    "N:" + C.lastName + ";" + C.firstName + ";;;",
    "FN:" + fullName,
    C.company   && "ORG:" + C.company,
    C.title     && "TITLE:" + C.title,
    C.phoneIntl && "TEL;TYPE=CELL:" + C.phoneIntl,
    C.email     && "EMAIL;TYPE=INTERNET:" + C.email,
    C.website   && "URL:" + C.website,
    C.instagram && "X-SOCIALPROFILE;TYPE=instagram:" + C.instagram,
    C.facebook  && "X-SOCIALPROFILE;TYPE=facebook:" + C.facebook,
    "END:VCARD"].filter(Boolean).join("\r\n");
  const blob = new Blob([v], {type:"text/vcard;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fullName.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + ".vcf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
});
</script>
